<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murali Krishna Rice Mill - Payment Calculator</title>

<style>
  body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 20px;
  }
  .container {
    max-width: 450px;
    background: white;
    padding: 20px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
  }
  .result {
    margin-top: 20px;
    padding: 15px;
    background: #e8f5e9;
    border-radius: 8px;
  }
  .final {
    font-size: 20px;
    font-weight: bold;
    color: green;
  }
  .print-btn {
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
  }
  .header {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
  }
</style>

</head>
<body>

<div class="container">
  <div class="header">Murali Krishna Rice Mill</div>

  <h3>Farmer Payment Calculator</h3>

  <label>Net Weight (kg)</label>
  <input type="number" id="weight">

  <label>Number of Bags</label>
  <input type="number" id="bags">

  <label>Rate (₹ per quintal)</label>
  <input type="number" id="rate" value="2350">

  <label>Hamali per bag (₹)</label>
  <input type="number" id="hamali" value="20">

  <label>Weighbridge Charge (₹)</label>
  <input type="number" id="wb" value="50">

  <label>Cash Cutting (%)</label>
  <input type="number" id="cut" value="1">

  <button onclick="calculate()">Calculate</button>
  <button onclick="resetForm()">Reset</button>
  <button class="print-btn" onclick="downloadSlip()">Download / Print Slip</button>

  <div class="result" id="output"></div>
</div>

<script>
let slipHTML = "";

function calculate() {
  let weight = parseFloat(document.getElementById("weight").value);
  let bags = parseInt(document.getElementById("bags").value);
  let rate = parseFloat(document.getElementById("rate").value);
  let hamaliRate = parseFloat(document.getElementById("hamali").value);
  let wb = parseFloat(document.getElementById("wb").value);
  let cutPercent = parseFloat(document.getElementById("cut").value);

  if (!weight || weight <= 0 || bags < 0 || !rate) {
    alert("Enter valid values");
    return;
  }

  let bagCut = bags * 2;
  let adjustedWeight = weight - bagCut;
  let quintals = adjustedWeight / 100;
  let total = quintals * rate;

  let hamali = bags * hamaliRate;
  let costCut = total * (cutPercent / 100);
  let totalDeductions = hamali + wb + costCut;
  let final = total - totalDeductions;

  slipHTML = `
    <h2 style="text-align:center;">Murali Krishna Rice Mill</h2>
    <hr>
    <p>Net Weight: ${weight} kg</p>
    <p>Bags: ${bags}</p>
    <p>Bag Cutting: ${bagCut} kg</p>
    <p><strong>Adjusted Weight: ${adjustedWeight.toFixed(2)} kg</strong></p>

    <p>Quintals: ${quintals.toFixed(2)}</p>
    <p>Rate: ₹${rate}</p>
    <p><strong>Gross Amount: ₹${total.toFixed(2)}</strong></p>

    <hr>
    <h3>Cuttings</h3>
    <p>Hamali: ₹${hamali.toFixed(2)}</p>
    <p>Weighbridge: ₹${wb.toFixed(2)}</p>
    <p>Cash Cutting (${cutPercent}%): ₹${costCut.toFixed(2)}</p>
    <p><strong>Total Deduction: ₹${totalDeductions.toFixed(2)}</strong></p>

    <hr>
    <h2 style="color:green;">Final Payment: ₹${final.toFixed(2)}</h2>
  `;

  document.getElementById("output").innerHTML = slipHTML;
}

function downloadSlip() {
  if (!slipHTML) {
    alert("Calculate first!");
    return;
  }

  let win = window.open("", "", "width=600,height=700");
  win.document.write(`
    <html>
    <head><title>Payment Slip</title></head>
    <body>
      ${slipHTML}
      <script>window.print();<\/script>
    </body>
    </html>
  `);
  win.document.close();
}

function resetForm() {
  document.getElementById("weight").value = "";
  document.getElementById("bags").value = "";
  document.getElementById("output").innerHTML = "";
  slipHTML = "";
}
</script>

</body>
</html>
