<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murali Krishna Rice Mill</title>

<style>
  body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 20px;
  }
  .container {
    max-width: 520px;
    background: white;
    padding: 20px;
    margin: auto;
    border-radius: 10px;
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
  }
  .result {
    margin-top: 20px;
    padding: 15px;
    background: #e8f5e9;
    border-radius: 8px;
  }
  .final {
    font-size: 20px;
    font-weight: bold;
    color: green;
  }
</style>

</head>
<body>

<div class="container">
  <h2 style="text-align:center;">Murali Krishna Rice Mill</h2>

  <label>Farmer Name / రైతు పేరు</label>
  <input type="text" id="farmer">

  <label>Vehicle Number / వాహన నంబర్</label>
  <input type="text" id="vehicle">

  <label>Weighbridge Number / తూకం రశీదు నంబర్</label>
  <input type="text" id="wbnum">

  <label>Date / తేదీ</label>
  <input type="date" id="date">

  <label>Net Weight (kg) / నికర బరువు</label>
  <input type="number" id="weight">

  <label>Bags / సంచులు</label>
  <input type="number" id="bags">

  <label>Rate (₹ per quintal) / రేట్</label>
  <input type="number" id="rate" value="2350">

  <label>Hamali per bag (₹) / హమాలి (ప్రతి సంచి)</label>
  <input type="number" id="hamali" value="20">

  <label>Weighbridge Charge (₹) / తూకం ఛార్జ్</label>
  <input type="number" id="wb" value="50">

  <label>Cash Cutting (%) / నగదు కోత (%)</label>
  <input type="number" id="cut" value="1">

  <button onclick="calculate()">Calculate</button>
  <button onclick="downloadSlip()">Download / Print</button>

  <div class="result" id="output"></div>
</div>

<script>
document.getElementById("date").valueAsDate = new Date();

let slipHTML = "";

function calculate() {
  let farmer = document.getElementById("farmer").value;
  let vehicle = document.getElementById("vehicle").value;
  let wbnum = document.getElementById("wbnum").value;
  let date = document.getElementById("date").value;

  let weight = parseFloat(document.getElementById("weight").value);
  let bags = parseInt(document.getElementById("bags").value);
  let rate = parseFloat(document.getElementById("rate").value);
  let hamaliRate = parseFloat(document.getElementById("hamali").value);
  let wbCharge = parseFloat(document.getElementById("wb").value);
  let cutPercent = parseFloat(document.getElementById("cut").value);

  if (!farmer || !weight || !rate) {
    alert("Fill required fields");
    return;
  }

  let bagCut = bags * 2;
  let adjustedWeight = weight - bagCut;
  let quintals = adjustedWeight / 100;
  let total = quintals * rate;

  let hamali = bags * hamaliRate;
  let costCut = total * (cutPercent / 100);
  let totalDeductions = hamali + wbCharge + costCut;
  let final = total - totalDeductions;

  slipHTML = `
    <h2 style="text-align:center;">Murali Krishna Rice Mill</h2>
    <hr>

    <p><b>Farmer / రైతు:</b> ${farmer}</p>
    <p><b>Vehicle / వాహనం:</b> ${vehicle}</p>
    <p><b>Weighbridge No / తూకం నం:</b> ${wbnum}</p>
    <p><b>Date / తేదీ:</b> ${date}</p>

    <hr>

    <p>Net Weight / నికర బరువు: ${weight} kg</p>
    <p>Bags / సంచులు: ${bags}</p>
    <p>Cutting / కటింగ్: ${bagCut} kg</p>
    <p><b>Adjusted Weight / సరిచేసిన బరువు: ${adjustedWeight.toFixed(2)} kg</b></p>

    <p>Quintals / క్వింటాళ్లు: ${quintals.toFixed(2)}</p>
    <p>Rate / రేట్: ₹${rate}</p>
    <p><b>Gross Amount / మొత్తం: ₹${total.toFixed(2)}</b></p>

    <hr>

    <h3>Cuttings / కోతలు</h3>
    <p>Hamali / హమాలి: ₹${hamali.toFixed(2)}</p>
    <p>Weighbridge / తూకం ఛార్జ్: ₹${wbCharge.toFixed(2)}</p>
    <p>Cash Cutting (${cutPercent}%) / నగదు కోత: ₹${costCut.toFixed(2)}</p>

    <p><b>Total Deduction / మొత్తం కోత: ₹${totalDeductions.toFixed(2)}</b></p>

    <hr>

    <h2 style="color:green;">Final Payment / చివరి చెల్లింపు: ₹${final.toFixed(2)}</h2>
  `;

  document.getElementById("output").innerHTML = slipHTML;
}

function downloadSlip() {
  if (!slipHTML) {
    alert("Calculate first!");
    return;
  }

  let win = window.open("", "", "width=600,height=700");
  win.document.write(`
    <html>
    <body>
      ${slipHTML}
      <script>window.print();<\/script>
    </body>
    </html>
  `);
  win.document.close();
}
</script>

</body>
</html>
